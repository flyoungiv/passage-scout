[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "passage-scout"
version = "0.1.0"
description = "Passage-first web-backed RAG with observable Python stages"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3", "python-multipart>=0.0.20,<1",
  "beautifulsoup4>=4.13,<5", "markdownify>=1.1,<2", "pypdf>=5.4,<7",
  "opentelemetry-api>=1.30,<2", "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.26,<2", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
